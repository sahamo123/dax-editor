name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux is the required gate. macOS and Windows are reported but do not block
    # until we have confirmed they pass; flip `experimental` to false then.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: pnpm install --frozen-lockfile

      # Runs lint, build/typecheck, doc coverage, knowledge-base validation,
      # dead-code detection and all tests: the same command contributors run locally.
      - run: pnpm check

      # Harness self-test: the deterministic solver must pass every eval task.
      - run: pnpm eval --adapter oracle

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        env:
          # Passed through the environment so a malicious title cannot inject shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "PR title must follow Conventional Commits, e.g. 'feat(core): add keepRanges'"
            echo "Got: $PR_TITLE"
            exit 1
          fi
