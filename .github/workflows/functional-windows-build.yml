name: Windows functional candidate

# Review-branch build only: uploads an unsigned candidate, never publishes a release.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/functional-windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'codex/functional-windows-build')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: functional-windows
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the wired engine
        run: pnpm --filter "@dax/engine..." build
      - name: Prepare verified offline AI and speech
        run: |
          node apps/desktop/scripts/prepare-offline-ai.mjs
          node apps/desktop/scripts/prepare-offline-speech.mjs
      - name: Prepare LGPL-safe Windows sidecars
        run: node apps/desktop/scripts/prepare-sidecars.mjs --release --target x86_64-pc-windows-msvc
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: --bundles nsis
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: dax-functional-[platform]-[arch]-[bundle]
