name: Real Blender acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/blender-acceptance.yml", "scripts/verify-blender.mjs", "packages/core/assets/blender/**", "packages/engine/src/blender.ts"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      # Blender is GPL and remains a separate optional process; never linked or shipped in the app.
      - name: Install real render tools
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@dax/engine..." build
      - run: node scripts/verify-blender.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blender-real-evidence
          path: artifacts/blender-acceptance/
          if-no-files-found: error
