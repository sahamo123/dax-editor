name: Existing Windows candidate local transfer
# Read-only transport of a fixed, already successful build; never rebuild or run it.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/candidate-local-transfer.yml"]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    if: github.head_ref == 'codex/candidate-local-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dax-functional-windows-x64-nsis
          run-id: 39925892009
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-input
      - name: Split and hash the existing installer
        id: split
        run: node scripts/candidate-transfer.mjs candidate-input candidate-transfer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: fromJSON(steps.split.outputs.parts) > 0
        with:
          name: dax-local-part-0
          path: candidate-transfer/part-0/installer.bin
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: fromJSON(steps.split.outputs.parts) > 1
