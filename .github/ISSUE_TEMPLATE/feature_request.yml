name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the editing task, not the solution. "I want to remove ums from a tutorial" is better than "add a button".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: surface
    attributes:
      label: Where should it be available?
      multiple: true
      options:
        - Desktop app
        - CLI
        - MCP server
        - Not sure
